#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# `include` splices another file's remotes into the list, resolved relative
# to this file. The child's REVERSE is applied once even though lircd runs
# its fix-ups over the child's remotes twice (child pass, then parent pass).
#
begin remote
  name  parent_first
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000
      begin codes
          KEY_P1                   0x81
      end codes
end remote

include "include_child.conf"

begin remote
  name  parent_last
  bits            8
  flags SPACE_ENC
  one           600  1600
  zero          600   600
  ptrail        600
  gap          40000
      begin codes
          KEY_P2                   0x82
      end codes
end remote
