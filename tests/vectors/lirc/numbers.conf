#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# lircd parses every number with strtoul/strtol base 0: 0x is hex and a
# leading 0 is octal -- durations included. Codes wider than `bits` are
# masked (with a warning), and -1 wraps to all ones first.
#
begin remote
  name  numbers
  bits           010
  flags SPACE_ENC
  header       0x2328 04311
  one          0x230 01540
  zero           560 0x230
  ptrail       01060
  pre_data_bits  0x8
  pre_data       0377
  gap          0x1A5E0
      begin codes
          KEY_OCT                  017
          KEY_HEX                  0xF0
          KEY_DEC                  99 # decimal
          KEY_NEG                  -1
          KEY_WIDE                 0x1FF
      end codes
end remote
