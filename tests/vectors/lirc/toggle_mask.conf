#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# toggle_mask (Sharp-style): lircd counts sends 0, 1, 2, 3, 2, 3, ... and
# inverts the masked bits on odd counts. Five sends show the whole cycle.
#
begin remote
  name  toggle_mask
  bits           15
  flags SPACE_ENC
  one           320  1680
  zero          320   680
  ptrail        320
  gap          40000
  toggle_mask  0x3FF
      begin codes
          KEY_POWER                0x41A2
          KEY_1                    0x4202
      end codes
end remote
