#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# RC6 mode 6A shape: header, a 21-bit pre_data, and rc6_mask marking the one
# double-width bit. The second remote states the same bit the pre-rc6_mask
# way, as a legacy toggle_bit, from which lircd derives both rc6_mask and
# toggle_bit_mask (config_file.c:1272-1286).
#
begin remote
  name  rc6_mce
  bits           16
  flags RC6|CONST_LENGTH
  eps            30
  aeps          100
  header       2667   889
  one           444   444
  zero          444   444
  pre_data_bits   21
  pre_data       0x37FF0
  gap          105000
  toggle_bit_mask 0x8000
  rc6_mask     0x100000000
      begin codes
          KEY_POWER                0x7BF3
          KEY_1                    0x7BFE
      end codes
end remote

begin remote
  name  rc6_legacy
  bits           16
  flags RC6|CONST_LENGTH
  header       2667   889
  one           444   444
  zero          444   444
  pre_data_bits   21
  pre_data       0x37FF0
  gap          105000
  toggle_bit      5
      begin codes
          KEY_POWER                0x7BF3
          KEY_2                    0x7BFD
      end codes
end remote
