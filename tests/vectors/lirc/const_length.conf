#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# CONST_LENGTH arithmetic: the NO_HEAD_REP header quirk, a frame too long
# for its gap (lircd refuses it), and gap2 on either side of gap.
#
begin remote
  name  nohead_const
  bits           16
  flags SPACE_ENC|CONST_LENGTH|NO_HEAD_REP
  header       3400  1700
  one           420  1270
  zero          420   420
  ptrail        420
  pre_data_bits   32
  pre_data       0x40040100
  gap          75000
      begin codes
          KEY_POWER                0xBCBD
          KEY_1                    0x0809
      end codes
end remote

begin remote
  name  too_short
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  one           560  1690
  zero          560   560
  ptrail        560
  gap          20000
      begin codes
          KEY_ZEROS                0x0000
          KEY_ONES                 0xFFFF
          KEY_FEW                  0x0101
      end codes
end remote

begin remote
  name  gap2_const
  bits            8
  flags SPACE_ENC|CONST_LENGTH
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  gap          50000 40000
      begin codes
          KEY_A                    0x5A
      end codes
end remote

begin remote
  name  gap2_plain
  bits            8
  flags SPACE_ENC
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000 45000
      begin codes
          KEY_B                    0xA5
      end codes
end remote
