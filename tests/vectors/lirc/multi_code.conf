#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# Buttons with several codes on one line (lircd's code->next list). With a
# gap of 10 ms or more each send takes the next code; below 10 ms lircd
# concatenates the remaining codes -- as repeats -- into the first send. An
# XMP remote cycles its list forever instead of ending it.
#
begin remote
  name  multi_slow
  bits            8
  flags SPACE_ENC
  header       4000  4000
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000
      begin codes
          KEY_A                    0x01 0x02 0x03
          KEY_B                    0x10 # a comment ends the list: 0x20
          KEY_C                    0x40 0x80
      end codes
end remote

begin remote
  name  multi_fast
  bits            8
  flags SPACE_ENC
  header       4000  4000
  one           500  1500
  zero          500   500
  ptrail        500
  gap           5000
      begin codes
          KEY_D                    0x11 0x22 0x33
          KEY_E                    0x44
      end codes
end remote

begin remote
  name  multi_fast_ditto
  bits            8
  flags SPACE_ENC
  header       4000  4000
  one           500  1500
  zero          500   500
  ptrail        500
  repeat       4000  2000
  gap           6000
      begin codes
          KEY_F                    0x55 0x66
      end codes
end remote

begin remote
  name  xmp_multi
  bits           24
  flags XMP
  one             0   137
  zero          210   760
  ptrail        210
  pre_data_bits   32
  pre_data       0x170F443E
  post_data_bits   8
  post_data      0x0
  pre           210 13800
  gap          80000
      begin codes
          KEY_OK                   0x1E0001 0x1E8001
      end codes
end remote
