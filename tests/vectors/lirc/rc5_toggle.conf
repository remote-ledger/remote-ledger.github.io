#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# Biphase (RC5): every bit is a space/pulse pair, so a frame's leading space
# is dropped; the toggle bit is forced from lircd's per-press toggle state.
# The second remote starts with its toggle bit set in the first code (lircd
# then starts its state at 0), spells the protocol SHIFT_ENC, and uses a
# two-bit toggle_bit_mask, which XORs instead of forcing.
#
begin remote
  name  rc5_tv
  bits           13
  flags RC5|CONST_LENGTH
  eps            30
  aeps          100
  one           889   889
  zero          889   889
  plead         889
  gap          113792
  toggle_bit_mask 0x800
      begin codes
          KEY_1                    0x1001
          KEY_2                    0x1002
          KEY_3                    0x1803
      end codes
end remote

begin remote
  name  rc5_shift
  bits           12
  flags SHIFT_ENC
  one           889   889
  zero          889   889
  plead         889
  gap          89000
  toggle_bit_mask 0x600
      begin codes
          KEY_A                    0x655
          KEY_B                    0x0AA
          KEY_C                    0x0F0
      end codes
end remote
