#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# min_repeat, which irsimsend zeroes but lircd honours: below a 10 ms gap
# lircd concatenates that many repeats into the press, counting down
# repeat_countdown. A raw code is first copied out of its own array
# ("unrolling"). The vectors for this file are generated both ways.
#
begin remote
  name  mr_fast
  bits            8
  flags SPACE_ENC
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  gap           8000
  min_repeat      2
      begin codes
          KEY_A                    0x3C
      end codes
end remote

begin remote
  name  mr_fast_ditto
  bits            8
  flags SPACE_ENC|CONST_LENGTH
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  repeat       2000   500
  gap           9500
  min_repeat      1
      begin codes
          KEY_B                    0x01
      end codes
end remote

begin remote
  name  mr_slow
  bits            8
  flags SPACE_ENC
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000
  min_repeat      3
      begin codes
          KEY_C                    0x3C
      end codes
end remote

begin remote
  name  mr_multi
  bits            8
  flags SPACE_ENC
  header       2000  1000
  one           500  1500
  zero          500   500
  ptrail        500
  gap           7000
  min_repeat      1
      begin codes
          KEY_D                    0x11 0x22
      end codes
end remote

begin remote
  name  mr_raw
  flags RAW_CODES
  gap           6000
  min_repeat      2
      begin raw_codes
          name KEY_E
              2000  1000   500   500   500  1500   500
      end raw_codes
end remote
