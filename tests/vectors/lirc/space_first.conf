#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# SPACE_FIRST: each bit is its space, then its pulse. With a header the first
# bit's space merges into the header's; without one it is dropped.
#
begin remote
  name  sf_header
  bits           12
  flags SPACE_FIRST|CONST_LENGTH
  header       2400   600
  one           600  1200
  zero          600   600
  gap          45000
      begin codes
          KEY_A                    0x925
          KEY_B                    0x16E
      end codes
end remote

begin remote
  name  sf_bare
  bits           12
  flags SPACE_FIRST
  one           600  1200
  zero          600   600
  gap          30000
      begin codes
          KEY_C                    0x925
      end codes
end remote
