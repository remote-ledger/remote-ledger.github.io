#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# lircd rejects this file. A leading 0 makes a number octal, so 0568 is not a number.
#
begin remote
  name  bad_octal
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          0568  560
  ptrail        500
  gap           40000
      begin codes
          KEY_A                    0x0A
      end codes
end remote
