#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# raw_codes: durations may span lines and must be odd in number. A raw
# remote with ditto timings shows lircd's stale buffer pointer: the repeat is
# built in the send buffer, but the driver reads the raw code it last sent.
#
begin remote
  name  raw_plain
  flags RAW_CODES|CONST_LENGTH
  eps            30
  aeps          100
  gap          50000
      begin raw_codes
          name KEY_A
              9000  4500   560   560   560  1690
               560
          name KEY_B
              9000  4500   560  1690   560   560   560
      end raw_codes
end remote

begin remote
  name  raw_ditto
  flags RAW_CODES
  ptrail        560
  repeat       9000  2250
  gap          40000
      begin raw_codes
          name KEY_C
              9000  4500   560   560   560  1690   560   560   560
      end raw_codes
end remote

# A zero duration parses, but lircd refuses to send it ("invalid send
# buffer", transmit.c:133-141).
begin remote
  name  raw_zero
  flags RAW_CODES
  gap          40000
      begin raw_codes
          name KEY_D
              9000  4500   560     0   560
      end raw_codes
end remote

# RAW_CODES with an ordinary codes block: no signals to send
# ("no signals for raw send", transmit.c:435-438).
begin remote
  name  raw_flag_codes
  flags RAW_CODES
  gap          40000
      begin codes
          KEY_E                    0x1
      end codes
end remote
