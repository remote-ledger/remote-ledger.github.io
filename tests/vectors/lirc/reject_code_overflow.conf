#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# lircd rejects this file. A code is a uint64_t, and strtoull reports 2^64 as
# out of range (config_file.c:249-263) rather than wrapping it.
#
begin remote
  name  code_overflow
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap           40000
      begin codes
          KEY_A                    18446744073709551616
      end codes
end remote
