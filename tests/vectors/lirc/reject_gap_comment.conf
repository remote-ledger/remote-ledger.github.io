#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# lircd rejects this file. A `#` after a value is not a comment: lircd reads it as gap2.
#
begin remote
  name  gap_comment
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap           40000 # the gap
      begin codes
          KEY_A                    0x0A
      end codes
end remote
