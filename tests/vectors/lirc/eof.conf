#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# A scancode-only remote whose second code has bit 27 (LIRC_EOF) set: the
# file driver writes `code 134217728` and raises SIGUSR1, and irsimsend dies
# there. KEY_LAST is never sent.
#
begin remote
  name  eof
  bits           32
  gap          40000
      begin codes
          KEY_FIRST                0x00000001
          KEY_EOF                  0x08000000
          KEY_LAST                 0x00000002
      end codes
end remote
