#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# Written with CRLF line endings, which lircd strips.
#
begin remote
  name  crlf
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap           40000
      begin codes
          KEY_A                    0x0A
      end codes
end remote
