#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# How a repeat is built: NO_HEAD_REP and NO_FOOT_REP trim a re-sent code,
# REPEAT_HEADER puts the header before ditto timings, repeat_gap replaces the
# gap after a ditto (even under CONST_LENGTH, which lircd only warns about),
# repeat_mask XORs a re-sent code, and a ditto carries plead and ptrail.
#
begin remote
  name  no_head_rep
  bits            8
  flags SPACE_ENC|NO_HEAD_REP
  header       4500  4500
  one           560  1690
  zero          560   560
  ptrail        560
  gap          40000
      begin codes
          KEY_A                    0x3C
      end codes
end remote

begin remote
  name  no_foot_rep
  bits            8
  flags SPACE_ENC|NO_FOOT_REP
  header       4500  4500
  one           560  1690
  zero          560   560
  foot          560  5000
  gap          40000
      begin codes
          KEY_B                    0x3C
      end codes
end remote

begin remote
  name  repeat_header
  bits            8
  flags SPACE_ENC|CONST_LENGTH|REPEAT_HEADER
  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat        560  2250
  gap          108000
      begin codes
          KEY_C                    0x3C
      end codes
end remote

begin remote
  name  repeat_gap
  bits            8
  flags SPACE_ENC
  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  gap          40000
  repeat_gap   96000
      begin codes
          KEY_D                    0x3C
      end codes
end remote

begin remote
