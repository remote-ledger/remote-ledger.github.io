begin remote
  name  repeat_lead_trail
  bits            8
  flags SPACE_ENC
  header       4500  4500
  one           560  1690
  zero          560   560
  plead         300
  ptrail        560
  repeat       4500  2250
  gap          40000
      begin codes
          KEY_G                    0x3C
      end codes
end remote
