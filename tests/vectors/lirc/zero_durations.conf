#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# An NRZ-style encoding written as zero-length halves: a one is only a space,
# a zero only a pulse. lircd's merging then runs levels together, and when a
# frame's buffer comes out even it drops the final space (sync_send_buffer,
# transmit.c:159-167) -- while still counting it toward CONST_LENGTH.
#
begin remote
  name  zero_durations
  bits            8
  flags SPACE_ENC|CONST_LENGTH
  one             0   800
  zero          800     0
  pre_data_bits   8
  pre_data       0xAA
  gap          100000
      begin codes
          KEY_1                    0x01
          KEY_2                    0x02
          KEY_F0                   0xF0
      end codes
end remote
