#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# The two symbol-based encodings lircd does transmit: RC-MM sends two bits
# per symbol (zero/one/two/three), XMP one nibble per symbol as pzero then
# szero + n * sone.
#
begin remote
  name  rcmm
  bits            8
  flags RCMM
  header        417   278
  three         167   778
  two           167   611
  one           167   444
  zero          167   278
  ptrail        167
  pre_data_bits  24
  pre_data       0x2A5008
  gap          89000
      begin codes
          KEY_POWER                0x0C
          KEY_MENU                 0xE4
      end codes
end remote

begin remote
  name  xmp
  bits           24
  flags XMP
  one             0   137
  zero          210   760
  ptrail        210
  pre_data_bits   32
  pre_data       0x170F443E
  post_data_bits   8
  post_data      0x0
  pre           210 13800
  gap          80000
      begin codes
          KEY_1                    0x1E0001
          KEY_2                    0x1D0002
      end codes
end remote
