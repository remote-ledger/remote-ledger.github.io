#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# strtoul accepts a leading '+', and a 32-bit field keeps only the low 32
# bits of what it parsed: this gap is 2^32 + 10000, which lircd uses as
# 10000 without a word of warning.
#
begin remote
  name  numbers_edge
  bits            8
  flags SPACE_ENC
  one          +500 +1500
  zero          500   500
  ptrail        500
  gap          4294977296
      begin codes
          KEY_A                    +0x0A
      end codes
end remote
