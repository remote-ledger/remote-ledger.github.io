#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# Obsolete spellings lircd still honours: toggle_bit N (counted from the MSB,
# 1-based) becomes toggle_bit_mask, repeat_bit is another name for it, and
# an explicit toggle_bit_mask wins over toggle_bit. Also: flags lines OR
# together, and REVERSE bit-reverses pre_data, post_data and codes.
#
begin remote
  name  legacy_toggle_bit
  bits           13
  flags RC5
  one           889   889
  zero          889   889
  plead         889
  gap          90000
  toggle_bit      2
      begin codes
          KEY_1                    0x1001
          KEY_2                    0x1802
      end codes
end remote

begin remote
  name  legacy_repeat_bit
  bits           13
  flags RC5
  one           889   889
  zero          889   889
  plead         889
  gap          90000
  repeat_bit      3
      begin codes
          KEY_3                    0x1003
      end codes
end remote

begin remote
  name  both_toggles
  bits           13
  flags RC5
  one           889   889
  zero          889   889
  plead         889
  gap          90000
  toggle_bit      2
  toggle_bit_mask 0x1
      begin codes
          KEY_4                    0x1004
      end codes
end remote

begin remote
  name  reversed
  bits            8
  flags SPACE_ENC
  flags REVERSE
  header       4000  4000
  one           500  1500
  zero          500   500
  ptrail        500
  pre_data_bits    4
  pre_data       0x1
  post_data_bits   4
  post_data      0x3
  gap          40000
      begin codes
          KEY_5                    0x01
          KEY_6                    0x80 0x80
      end codes
end remote
