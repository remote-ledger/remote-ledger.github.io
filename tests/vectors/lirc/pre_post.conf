#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# Every framing element around the code: header, plead (which merges into the
# first data pulse), pre_data and its pre pulse/space, post pulse/space and
# post_data, ptrail, and a foot (sent space-first).
#
begin remote
  name  pre_post
  bits            8
  flags SPACE_ENC
  header       4000  4000
  one           500  1500
  zero          500   500
  plead         300
  ptrail        500
  pre_data_bits    8
  pre_data       0xA5
  pre           500  3000
  post_data_bits   4
  post_data      0x9
  post          500  2500
  foot          700  7000
  gap          50000
      begin codes
          KEY_A                    0x0F
          KEY_B                    0xC3
      end codes
end remote
