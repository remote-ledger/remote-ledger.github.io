#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# read_config sorts remotes: non-raw first by total bit count, then raw by
# number of codes, stably. So the send order here is r_16, r_code, r_32,
# r_raw_small, r_raw. r_code has no bit timings, so the file driver writes
# only `code N` for it. irsimsend's "same name as the last button" test
# crosses remotes: r_32's first KEY_Y follows r_code's last KEY_Y, so its
# first send is already a repeat.
#
begin remote
  name  r_raw
  flags RAW_CODES
  gap          40000
      begin raw_codes
          name KEY_R1
              1000   500  1000
          name KEY_R2
              2000   500  2000
      end raw_codes
end remote

begin remote
  name  r_raw_small
  flags RAW_CODES
  gap          40000
      begin raw_codes
          name KEY_R3
              3000   500  3000
      end raw_codes
end remote

begin remote
  name  r_32
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits   16
  pre_data       0x00FF
  gap          108000
      begin codes
          KEY_Y                    0x00FF
          KEY_Z                    0x807F
      end codes
end remote

begin remote
  name  r_16
  bits           16
  flags SPACE_ENC
  header       4000  4000
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000
      begin codes
          KEY_X                    0x1234
      end codes
end remote

begin remote
  name  r_code
  bits           16
  eps            30
  aeps          100
  gap          40000
      begin codes
          KEY_X                    0x1234
          KEY_BIG                  0xFFFFFFFF
          KEY_Y                    0x5678
      end codes
end remote
