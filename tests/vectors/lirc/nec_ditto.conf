#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# NEC-style SPACE_ENC with a ditto repeat, padded to a constant 108 ms.
# The two consecutive KEY_VOLUMEUP lines exercise irsimsend treating a
# button named like the previous one as a repeat; the 31- and 32-byte names
# exercise its char[32] last_code buffer.
#
begin remote

  name  nec_ditto
  bits           16
  flags SPACE_ENC|CONST_LENGTH
  eps            30
  aeps          100

  header       9000  4500
  one           560  1690
  zero          560   560
  ptrail        560
  repeat       9000  2250
  pre_data_bits   16
  pre_data       0x20DF
  gap          108000
  toggle_bit_mask 0x0
  frequency    38000

      begin codes
          KEY_POWER                0x10EF
          KEY_VOLUMEUP             0x40BF
          KEY_VOLUMEUP             0x40BF
          KEY_MUTE                 0x906F
          KEY_A_NAME_THAT_IS_31_BYTES_LON 0x00FF
          KEY_A_NAME_THAT_IS_31_BYTES_LON 0x00FF
          KEY_A_NAME_THAT_IS_32_BYTES_LONG 0x807F
          KEY_A_NAME_THAT_IS_32_BYTES_LONG 0x807F
      end codes

end remote
