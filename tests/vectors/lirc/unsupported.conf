#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# GRUNDIG, BO and SERIAL parse but lircd will not send them. The file driver
# checks for missing bit timings first, though, so a timing-less GRUNDIG
# remote still gets its `code N` line; SERIAL's zero timing is filled in
# from baud during parsing (config_file.c:1295-1307), so it just fails.
#
begin remote
  name  grundig_timed
  bits            8
  flags GRUNDIG
  one           500  1000
  zero          500   500
  gap          40000
      begin codes
          KEY_A                    0x0A
      end codes
end remote

begin remote
  name  grundig_bare
  bits            8
  flags GRUNDIG
  gap          40000
      begin codes
          KEY_B                    0x0B
      end codes
end remote

begin remote
  name  bang_olufsen
  bits            8
  flags BO
  one           200  3000
  zero          200  6000
  gap          40000
      begin codes
          KEY_C                    0x0C
      end codes
end remote

begin remote
  name  serial
  bits            8
  flags SERIAL
  baud         1200
  serial_mode  8N1
  gap          40000
      begin codes
          KEY_D                    0x0D
      end codes
end remote

begin remote
  name  plain_after
  bits            8
  flags SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap          40000
      begin codes
          KEY_E                    0x0E
      end codes
end remote
