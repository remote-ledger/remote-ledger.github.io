#
# Synthetic, written for remote-ledger's lircd port tests. Not a real remote.
#
# lircd rejects this file. One flags line may name only one protocol.
#
begin remote
  name  two_protocols
  bits            8
  flags RC5|SPACE_ENC
  one           500  1500
  zero          500   500
  ptrail        500
  gap           40000
      begin codes
          KEY_A                    0x0A
      end codes
end remote
